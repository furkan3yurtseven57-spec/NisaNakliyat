<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <style>
      .navy-color { fill: #002D62; }
      .gold-color { fill: #E5A93B; }
    </style>
  </defs>

  <!-- Logo Emblem (Matches the official high-res logo exactly) -->
  <g transform="translate(10, 5)">
    <!-- Serif "N" in Navy Blue -->
    <path class="navy-color" d="M 18 20 H 34 V 23 H 30 V 32 L 54 59 V 29 H 50 V 26 H 66 V 29 H 62 V 62 H 48 L 24 32 V 59 H 30 V 62 H 18 V 59 H 24 V 29 H 18 Z" />
    
    <!-- Golden Armchair (High fidelity wingback style) -->
    <g class="gold-color">
      <!-- Backrest & Arms Seat Silhouette -->
      <path d="M 42 27 C 44 25, 46 25, 49 26 C 52 25, 54 25, 56 27 C 58 29, 57 32, 58 34 C 59 35, 60 36, 60 37 C 60 39, 57 40, 56 39 C 55 41, 43 41, 42 39 C 41 40, 38 39, 38 37 C 38 36, 39 35, 40 34 C 41 32, 40 29, 42 27 Z" />
      <!-- Left Front Leg -->
      <path d="M 43 40 L 41 45 H 42.5 L 44 40 Z" />
      <!-- Right Front Leg -->
      <path d="M 55 40 L 57 45 H 55.5 L 54 40 Z" />
      <!-- Back Legs -->
      <path d="M 46 40 L 45 43 H 46.5 Z" opacity="0.8" />
      <path d="M 52 40 L 53 43 H 54 Z" opacity="0.8" />
    </g>
    <!-- White cushion separator line -->
    <path d="M 41 36 C 44 38, 54 38, 57 36" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Sweeping Arrow with White Outline for Negative Space -->
    <!-- White duplicate underneath -->
    <path d="M 36 54 C 42 56, 50 56, 58 50 C 62 47, 66 44, 69 41 L 65 38 L 74 38 L 72 47 L 69 43 C 65 47, 61 51, 57 54 C 49 59, 41 58, 36 54 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    <!-- Navy Arrow on top -->
    <path d="M 36 54 C 42 56, 50 56, 58 50 C 62 47, 66 44, 69 41 L 65 38 L 74 38 L 72 47 L 69 43 C 65 47, 61 51, 57 54 C 49 59, 41 58, 36 54 Z" 
          class="navy-color" />
  </g>

  <!-- Typography -->
  <g transform="translate(95, 42)">
    <text font-family="'Hanken Grotesk', 'Inter', 'Montserrat', sans-serif" font-size="32" font-weight="900" fill="#002D62" letter-spacing="1.5">NİSA</text>
    <text font-family="'Hanken Grotesk', 'Inter', 'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#E5A93B" letter-spacing="4.5" x="2" y="22">MOBİLYA &amp; NAKLİYAT</text>
  </g>
</svg>
