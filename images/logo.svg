<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="100%" height="100%">
  <defs>
    <linearGradient id="navNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1d3a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Logo Mark (Emblem) -->
  <g transform="translate(10, 8)" filter="url(#subtle-shadow)">
    <!-- Rounded Outer Shield -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#navNavy)" />
    
    <!-- Stylized Truck Container (White) & Sofa/Arrow (Gold) -->
    <!-- Truck Cabin & Cargo Outline -->
    <path d="M14 43 H44 V33 L37 23 H18 L14 28 Z" fill="#ffffff" opacity="0.15" />
    
    <!-- Stylized 'N' combining with Furniture shape in Gold -->
    <!-- Armchair/Sofa inside the logo -->
    <path d="M22 28 H38 V38 H22 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Sofa Cushions & Backrest -->
    <path d="M25 33 H35 M28 28 V33 M32 28 V33" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Dynamic Arrow sweeping around representing transport/moving -->
    <path d="M12 36 C12 24 22 16 38 16 C48 16 52 22 52 22 M52 22 L46 20 M52 22 L50 28" 
          stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Wheels at the bottom -->
    <circle cx="20" cy="46" r="5" fill="url(#goldAccent)" />
    <circle cx="20" cy="46" r="2" fill="#ffffff" />
    
    <circle cx="44" cy="46" r="5" fill="url(#goldAccent)" />
    <circle cx="44" cy="46" r="2" fill="#ffffff" />
  </g>

  <!-- Logo Text (Horizontal Layout) -->
  <g transform="translate(90, 42)">
    <text font-family="'Hanken Grotesk', 'Inter', 'Montserrat', sans-serif" font-size="30" font-weight="900" fill="#0b1d3a" letter-spacing="1.5">NİSA</text>
    <text font-family="'Hanken Grotesk', 'Inter', 'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#d97706" letter-spacing="4.5" x="2" y="20">MOBİLYA &amp; NAKLİYAT</text>
  </g>
</svg>
